[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-omni-monitor"
version = "0.1.0"
description = "Hierarchical camera anomaly monitoring MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
jev = [
  "accelerate",
  "huggingface-hub",
  "librosa",
  "safetensors",
  "soundfile",
  "torch>=2.10",
  "torchvision",
  "transformers==5.17.0",
]
qwen = [
  "accelerate",
  "imageio-ffmpeg",
  "qwen-omni-utils[decord]",
  "torch>=2.10",
  "torchvision",
  "transformers>=4.51.3",
]

[project.scripts]
jev-monitor = "jev_monitor.cli:main"
jev-monitor-evaluate = "jev_monitor.evaluation:main"
jev-monitor-incidents = "jev_monitor.incidents:main"
jev-monitor-summarize-incidents = "jev_monitor.incidents:summary_main"
jev-monitor-qwen = "jev_monitor.qwen_analyzer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
